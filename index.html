<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="빛의 선을 긋는 일현과 달의 원을 베는 월아. 두 전투 스타일로 살아남는 액션 서바이벌."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="액션 서바이벌 프로토타입" />
    <meta
      property="og:description"
      content="달은 원을 파고, 해는 선을 긋는다."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="액션 서바이벌 프로토타입" />
    <meta
      name="twitter:description"
      content="달은 원을 파고, 해는 선을 긋는다."
    />
    <title>액션 서바이벌 프로토타입</title>
    <style>
      :root {
        --bg: #07090d;
        --fg: #e6e9ee;
        --dim: #7e8794;
        --accent: #56c7e8;
        /* 1920×1080을 1배로 삼고, 더 짧은 화면 축을 따라 HUD가 보정된다. */
        --ui-scale: clamp(12px, min(0.833333vw, 1.481481vh), 32px);
        --ui-safe-top: max(env(safe-area-inset-top, 0px), 0.65rem);
        --ui-safe-right: max(env(safe-area-inset-right, 0px), 0.8rem);
        --ui-safe-bottom: max(env(safe-area-inset-bottom, 0px), 0.7rem);
        --ui-safe-left: max(env(safe-area-inset-left, 0px), 0.8rem);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-size: var(--ui-scale);
      }
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
      }
      body {
        font-family: "Pretendard Variable", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        background: var(--bg);
        z-index: 10;
        transition: opacity 0.24s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 {
        padding-left: 0.16em;
        font-size: 1.55rem;
        font-weight: 760;
        letter-spacing: 0.16em;
      }
      #boot p {
        color: var(--dim);
        font-size: 0.64rem;
        font-weight: 650;
        letter-spacing: 0.22em;
      }
      .bar {
        width: min(18rem, 64vw);
        height: max(2px, 0.12rem);
        background: #242932;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 28%;
        background: var(--accent);
        animation: slide 1s steps(9, end) infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(460%); }
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: calc(var(--ui-safe-bottom) + 5.6rem);
        transform: translateX(-50%);
        padding: 0.34rem 0.62rem 0.31rem;
        border-left: 2px solid #56c7e8;
        color: #a8b0bb;
        background: rgba(8, 11, 16, 0.78);
        font-size: 0.68rem;
        font-weight: 560;
        letter-spacing: 0.08em;
        white-space: nowrap;
        z-index: 5;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #hint.hidden { opacity: 0; }

      #stats {
        position: fixed;
        top: var(--ui-safe-top);
        left: var(--ui-safe-left);
        font-variant-numeric: tabular-nums;
        font-size: 0.58rem;
        font-weight: 540;
        color: #737c88;
        letter-spacing: 0.035em;
        z-index: 5;
        pointer-events: none;
        line-height: 1.35;
      }

      @media (max-width: 560px) {
        :root {
          --ui-scale: clamp(11px, 3.076923vw, 13px);
        }
        #stats { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot,
        #hint {
          transition: none;
        }
        .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="stats"></div>
    <div id="hint" class="hidden">화면을 누른 채 움직이세요</div>
    <div id="boot">
      <h1>전투 준비 중</h1>
      <div class="bar"></div>
      <p>LOADING</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
