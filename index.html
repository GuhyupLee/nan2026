<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="빛의 선을 긋는 일현과 달의 원을 베는 월아. 두 전투 스타일로 살아남는 액션 서바이벌."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="액션 서바이벌 프로토타입" />
    <meta
      property="og:description"
      content="달은 원을 파고, 해는 선을 긋는다."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="액션 서바이벌 프로토타입" />
    <meta
      name="twitter:description"
      content="달은 원을 파고, 해는 선을 긋는다."
    />
    <title>액션 서바이벌 프로토타입</title>
    <style>
      :root {
        --bg: #05070d;
        --fg: #e8eef8;
        --dim: #7f8ca3;
        --accent: #4dd0ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
      body {
        font-family: "Pretendard", "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: var(--bg);
        z-index: 10;
        transition: opacity 0.45s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot h1 {
        font-size: clamp(1.6rem, 5vw, 2.6rem);
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      #boot p { color: var(--dim); font-size: 0.9rem; letter-spacing: 0.04em; }
      .bar {
        width: min(280px, 60vw);
        height: 2px;
        background: #1a2233;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        height: 100%;
        width: 40%;
        background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      #hint {
        position: fixed;
        left: 50%;
        bottom: 2.2rem;
        transform: translateX(-50%);
        color: var(--dim);
        font-size: 0.82rem;
        letter-spacing: 0.12em;
        z-index: 5;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #hint.hidden { opacity: 0; }

      #stats {
        position: fixed;
        top: 0.7rem;
        left: 0.85rem;
        font-variant-numeric: tabular-nums;
        font-size: 0.74rem;
        color: var(--dim);
        letter-spacing: 0.05em;
        z-index: 5;
        pointer-events: none;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="stats"></div>
    <div id="hint" class="hidden">화면을 누른 채 움직이세요</div>
    <div id="boot">
      <h1>전투 준비 중</h1>
      <div class="bar"></div>
      <p>LOADING</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
