name: Deploy

# 계획의 최우선 항목: 1일차부터 배포 URL이 살아있어야 한다.
# 마감 직전 배포 사고가 이런 대회 탈락의 1순위 원인이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 최신 커밋 하나만. 중간 실행은 취소한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 시뮬레이션이 깨진 채로 배포되는 것을 막는다.
      # three.js 의존이 src/sim 에 새어 들어가면 여기서 즉시 실패한다.
      - name: Simulation smoke check
        run: npm run check

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
